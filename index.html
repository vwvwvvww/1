<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="簡潔好玩的擲骰子工具">
  <title>骰來骰去 | 擲骰子</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="骰來骰去首頁">
        <span class="brand-mark">✦</span>
        <span>骰來骰去</span>
      </a>
      <span class="header-note">ROLL THE DAY</span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">A LITTLE LUCK</p>
        <h1 id="page-title">今天的答案，<em>交給骰子。</em></h1>
        <p class="intro">按下按鈕，讓一點隨機性替你打開下一步。</p>
      </div>
      <div class="status-pill" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText">準備好了</span>
      </div>
    </section>

    <section class="game-layout" aria-label="擲骰子遊戲區">
      <div class="dice-panel">
        <div class="panel-label"><span>YOUR ROLL</span><span id="rollNumber">#01</span></div>
        <div class="dice-stage">
          <div class="dice" id="dice" role="img" aria-label="骰子點數 1">
            <span class="pip pip-1"></span>
            <span class="pip pip-2"></span>
            <span class="pip pip-3"></span>
            <span class="pip pip-4"></span>
            <span class="pip pip-5"></span>
            <span class="pip pip-6"></span>
            <span class="pip pip-7"></span>
            <span class="pip pip-8"></span>
            <span class="pip pip-9"></span>
          </div>
          <span class="dice-shadow" aria-hidden="true"></span>
        </div>
        <div class="result-row">
          <span class="result-caption">RESULT</span>
          <strong id="resultValue">1</strong>
        </div>
        <button class="roll-button" id="rollButton" type="button">
          <span>擲骰子</span>
          <span class="button-icon" aria-hidden="true">↗</span>
        </button>
      </div>

      <aside class="history-panel" aria-labelledby="history-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">THE TRAIL</p>
            <h2 id="history-title">擲骰紀錄</h2>
          </div>
          <span class="count-badge" id="historyCount">0</span>
        </div>
        <ol class="history-list" id="historyList" aria-live="polite">
          <li class="empty-state" id="emptyState">你的每一次選擇<br>都會留在這裡。</li>
        </ol>
        <button class="clear-button" id="clearButton" type="button" disabled>清除紀錄 <span>↘</span></button>
      </aside>
    </section>

    <footer class="site-footer">
      <span>ONE ROLL AT A TIME</span>
      <span class="footer-line"></span>
      <span>© 2026</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
